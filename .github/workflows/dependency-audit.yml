name: Dependency audit

on:
    schedule:
        - cron: '23 13 * * 1'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    audit:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.9
            - run: bun install --frozen-lockfile --ignore-scripts
            - run: bun audit
